[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript"
version = "0.1.0"
description = "Word-for-word transcripts from any video URL (X, YouTube, ...), transcribed locally with Whisper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yt-dlp",
    "faster-whisper>=1.1",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-transcript = "video_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
